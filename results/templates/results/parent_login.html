<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Parent Login</title>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">👤</div>
        <h1>PARENT LOGIN</h1>

        {% if error %}
            <p style="color:#ffb3b3;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <select name="school" required>
                <option value="">Select School</option>
                {% for school in schools %}
                <option value="{{ school.id }}">{{ school.name }}</option>
                {% endfor %}
            </select>
            <input type="text" name="phone" placeholder="Phone Number">
            <div class="password-wrapper">
                <input type="password" name="password" id="password-field" placeholder="Password">
                <span class="toggle-eye" onclick="togglePassword()">👁️</span>
            </div>
            <button type="submit">LOGIN</button>
        </form>
        <a href="/results/parent/forgot-password/">Forgot Password?</a>

        <a href="/results/parent/signup/">New here? Create an account</a>
    </div>

    <script>
    function togglePassword() {
        const field = document.getElementById('password-field');
        field.type = field.type === 'password' ? 'text' : 'password';
    }
    </script>
</body>
</html>
