<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>ElimuHub</title>
</head>
<body class="landing-page">
    <div class="navbar">
        <div class="hamburger" onclick="toggleMenu()">&#9776;</div>
        <div class="nav-menu" id="nav-menu">
            <a href="/results/about/">About Us</a>
            <a href="/results/services/">Our Services</a>
        </div>
    </div>

    <h1 class="landing-title">ElimuHub</h1>
    <p class="landing-subtitle">School management made simple</p>

    <div class="role-grid">
        <div class="role-card">
            <h3>🏫 School</h3>
            <a href="/results/school/signup/">Register School</a>
            <a href="/results/school/login/" class="secondary">School Login</a>
        </div>

        <div class="role-card">
            <h3>👩‍🏫 Teacher</h3>
            <a href="/results/teacher/login/">Teacher Login</a>
            <a href="/results/teacher/signup/select/" class="secondary">Sign Up</a>
        </div>

        <div class="role-card">
            <h3>💰 Accountant</h3>
            <a href="/results/accountant/login/">Accountant Login</a>
            <a href="/results/accountant/signup/select/" class="secondary">Sign Up</a>
        </div>

        <div class="role-card">
            <h3>👨‍👩‍👧 Parent</h3>
            <a href="/results/parent/login/">Parent Login</a>
            <a href="/results/parent/signup/" class="secondary">Sign Up</a>
        </div>
    </div>

    <script>
    function toggleMenu() {
        document.getElementById('nav-menu').classList.toggle('show');
    }
    </script>
</body>
</html>
