<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Edit Fee Structure</title>
</head>
<body class="dashboard-page">
    <div class="dashboard-header">
        <h1>Edit Fee Structure</h1>
    </div>

    <div class="dashboard-section">
        <form method="POST">
            {% csrf_token %}
            <label>Grade:</label><br>
            <input type="number" name="grade" value="{{ fee.grade }}" required><br><br>

            <label>Term:</label><br>
            <input type="number" name="term" value="{{ fee.term }}" required><br><br>

            <label>Academic Year:</label><br>
            <input type="number" name="academic_year" value="{{ fee.academic_year }}" required><br><br>

            <label>Amount Due:</label><br>
            <input type="number" step="0.01" name="amount_due" value="{{ fee.amount_due }}" required><br><br>

            <button type="submit" class="action-btn" style="border:none; cursor:pointer;">Save Changes</button>
        </form>
        <a href="/results/accountant/dashboard/" class="action-btn" style="background:#888; margin-top:10px;">Cancel</a>
    </div>
</body>
</html>
