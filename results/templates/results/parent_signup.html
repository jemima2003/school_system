<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Parent Signup</title>
</head>
<body>
    <h1>Parent Signup</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <p><a href="/results/parent/login/">Already have an account? Log in</a></p>
</body>
</html>
