<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>School Login</title>
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>School Login</h1>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="School Email">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Log In</button>
        </form>

        <a href="/results/school/signup/">New school? Register here</a>
    </div>
</body>
</html>
