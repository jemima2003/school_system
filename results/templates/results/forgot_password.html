<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Forgot Password</title>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">🔑</div>
        <h1>RESET PASSWORD</h1>

        {% if error %}
            <p style="color:#ffb3b3;">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p style="color:#a3e6a3;">{{ success }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Reset Password</button>
        </form>

        <a href="{{ login_url }}">Back to {{ role }} Login</a>
    </div>
</body>
</html>
