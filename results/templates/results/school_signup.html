<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Register Your School</title>
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Register Your School</h1>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create School Account</button>
        </form>

        <a href="/results/school/login/">Already registered? Log in</a>
    </div>
</body>
</html>
