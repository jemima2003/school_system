<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Accountant Login</title>
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>Accountant Login</h1>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email">
            <div class="password-wrapper">
                <input type="password" name="password" id="password-field" placeholder="Password">
                <span class="toggle-eye" onclick="togglePassword()">👁️</span>
            </div>
            <button type="submit">Log In</button>
        </form>
    </div>

    <script>
    function togglePassword() {
        const field = document.getElementById('password-field');
        field.type = field.type === 'password' ? 'text' : 'password';
    }
    </script>
</body>
</html>
