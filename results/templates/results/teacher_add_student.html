<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'results/style.css' %}">
    <title>Add Student</title>
</head>
<body>
    <h1>Add Student - Grade {{ teacher.grade }}</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <label>Full Name:</label><br>
        <input type="text" name="full_name" required><br><br>

        <label>Admission Number:</label><br>
        <input type="text" name="admission_number" required><br><br>

        <label>Stream (optional):</label><br>
        <input type="text" name="stream"><br><br>

        <label>Verification Code (for parent signup):</label><br>
        <input type="text" name="verification_code"><br><br>

        <button type="submit">Add Student</button>
    </form>

    <p><a href="/results/teacher/dashboard/">Back to Dashboard</a></p>
</body>
</html>
